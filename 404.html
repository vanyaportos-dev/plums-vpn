<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Страница не найдена — Plume Connect" />
  <title>404 — Страница не найдена | Plume Connect</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🪶</text></svg>" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Дополнительные стили для 404 */
    .page-404-orb-1 {
      position: fixed;
      width: 600px;
      height: 600px;
      top: -200px;
      left: -100px;
      background: radial-gradient(circle, rgba(108, 92, 231, 0.12) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      animation: float404 10s ease-in-out infinite;
    }

    .page-404-orb-2 {
      position: fixed;
      width: 500px;
      height: 500px;
      bottom: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(0, 214, 143, 0.06) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      animation: float404 8s ease-in-out infinite reverse;
    }

    .page-404-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    @keyframes float404 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }

    .error-icon {
      width: 80px;
      height: 80px;
      background: var(--accent-light);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--accent);
      margin: 0 auto 32px;
      animation: fadeInUp 0.5s ease both;
    }

    .error-code {
      animation: fadeInUp 0.5s ease 0.1s both;
    }

    .error-title {
      animation: fadeInUp 0.5s ease 0.2s both;
    }

    .error-desc {
      animation: fadeInUp 0.5s ease 0.3s both;
    }

    .error-actions {
      animation: fadeInUp 0.5s ease 0.4s both;
    }

    .error-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 24px;
      transition: var(--transition);
      animation: fadeInUp 0.5s ease 0.5s both;
    }

    .error-back-link:hover {
      color: var(--text-primary);
    }

    .error-back-link:hover i {
      transform: translateX(-3px);
    }

    .error-back-link i {
      transition: var(--transition);
    }
  </style>
</head>
<body>

  <!-- Декоративный фон -->
  <div aria-hidden="true">
    <div class="page-404-grid"></div>
    <div class="page-404-orb-1"></div>
    <div class="page-404-orb-2"></div>
  </div>

  <main class="page-404" role="main">

    <!-- Иконка -->
    <div class="error-icon" aria-hidden="true">
      <i class="fas fa-compass"></i>
    </div>

    <!-- Код ошибки -->
    <div class="error-code" aria-label="Ошибка 404">404</div>

    <!-- Заголовок -->
    <h1 class="error-title">Страница не найдена</h1>

    <!-- Описание -->
    <p class="error-desc">
      Кажется, эта страница улетела в другое измерение. Возможно, ссылка устарела или адрес введён неверно.
    </p>

    <!-- Кнопки -->
    <div class="error-actions">
      <a href="/" class="btn btn-primary btn-lg">
        <i class="fas fa-home" aria-hidden="true"></i>
        На главную
      </a>
      <a href="/dashboard" class="btn btn-ghost btn-lg">
        <i class="fas fa-th-large" aria-hidden="true"></i>
        В кабинет
      </a>
    </div>

    <!-- Ссылка назад -->
    <a href="javascript:history.back()" class="error-back-link">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      Вернуться назад
    </a>

  </main>

  <!-- Scripts -->
  <script src="app.js"></script>

</body>
</html>
